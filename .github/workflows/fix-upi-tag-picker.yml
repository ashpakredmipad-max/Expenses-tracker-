name: Fix UPI tag picker compile

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix malformed annotation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt')
          s = p.read_text()
          bad = '@optIn(ExperimentalLayoutApi(::class)\\n@Composable\\n@OptIn(ExperimentalLayoutApi::class)'
          good = '@OptIn(ExperimentalLayoutApi::class)'
          if bad not in s:
              raise SystemExit('Expected malformed annotation not found')
          p.write_text(s.replace(bad, good, 1))
          PY

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt
          git commit -m 'Fix UPI tag picker annotation'
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/fix-upi-tag-picker.yml || true
          git commit -m 'Remove temporary UPI tag picker workflow' || true
          git push || true
