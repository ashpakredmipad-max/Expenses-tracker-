name: Apply saved UPI tag picker v4

on:
  push:
    paths:
      - '.github/workflows/apply-upi-tag-picker-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply saved tag picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt")
          text = path.read_text()
          marker = 'private fun TagUpiDialog'
          marker_pos = text.find(marker)
          if marker_pos == -1:
              raise SystemExit("TagUpiDialog marker not found")
          start = text.rfind('@OptIn', 0, marker_pos)
          if start == -1:
              start = marker_pos
          replacement = Path(".github/upi_tag_dialog_replacement.txt").read_text()
          path.write_text(text[:start] + replacement)
          print("Updated", path)
          PY
      - name: Commit app change and remove temporary files
        run: |
          rm -f .github/workflows/apply-upi-tag-picker.yml .github/workflows/apply-upi-tag-picker-v2.yml .github/workflows/apply-upi-tag-picker-v3.yml .github/workflows/apply-upi-tag-picker-v4.yml .github/upi_tag_dialog_replacement.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add saved UPI tag picker"
          git push
