name: Apply saved UPI tag picker v2

on:
  push:
    paths:
      - '.github/workflows/apply-upi-tag-picker-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply saved tag picker
        env:
          TAG_DIALOG_B64: "QG9wdEluKEV4cGVyaW1lbnRhbExheW91dEFwaSg6OmNsYXNzKVxuQENvbXBvc2FibGVcbnByaXZhdGUgZnVuIFRhZ1VwaURpYWxvZyhz "
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import os

          path = Path("app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt")
          text = path.read_text()
          start = text.find('@OptIn(ExperimentalLayoutApi::class)\n@Composable\nprivate fun TagUpiDialog')
          if start == -1:
              raise SystemExit("TagUpiDialog start not found")
          replacement = base64.b64decode(os.environ["TAG_DIALOG_B64"]).decode()
          path.write_text(text[:start] + replacement)
          print("Updated", path)
          PY

      - name: Commit app change and remove temporary workflows
        run: |
          rm -f .github/workflows/apply-upi-tag-picker.yml .github/workflows/apply-upi-tag-picker-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt .github/workflows/apply-upi-tag-picker.yml .github/workflows/apply-upi-tag-picker-v2.yml
          git commit -m "Add saved UPI tag picker"
          git push
