name: Apply saved UPI tag picker

on:
  push:
    paths:
      - '.github/workflows/apply-upi-tag-picker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update UPI tag dialog
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt")
          text = path.read_text()
          start = text.find('@OptIn(ExperimentalLayoutApi::class)\n@Composable\nprivate fun TagUpiDialog')
          if start == -1:
              raise SystemExit("TagUpiDialog start not found")

          replacement = r'''@OptIn(ExperimentalLayoutApi::class)
@Composable
private fun TagUpiDialog(sms: UpiSms, categories: List<CategoryEntity>, onDismiss: () -> Unit, onSaved: (String) -> Unit) {
    val scope = rememberCoroutineScope()
    var savedTags by remember { mutableStateOf<List<UpiTag>>(emptyList()) }
    var selectedTag by remember { mutableStateOf<UpiTag?>(null) }
    var selectedIcon by remember { mutableStateOf("Restaurant") }
    var selectedColor by remember { mutableStateOf("#FF7043") }
    var selectedCategory by remember { mutableStateOf<CategoryEntity?>(null) }
    var tagMenuExpanded by remember { mutableStateOf(false) }
    var categoryMenuExpanded by remember { mutableStateOf(false) }
    var saving by remember { mutableStateOf(false) }
    var loadingTags by remember { mutableStateOf(true) }
    var error by remember { mutableStateOf<String?>(null) }

    LaunchedEffect(Unit) {
        val uid = FirebaseAuth.getInstance().currentUser?.uid
        if (uid != null) {
            try {
                val snapshot = FirebaseFirestore.getInstance()
                    .collection("users").document(uid).collection("upi_tags")
                    .get().await()
                savedTags = snapshot.documents.mapNotNull { doc ->
                    val name = doc.getString("tagName")?.trim()
                    val recipient = doc.getString("recipient")?.trim()
                    if (name.isNullOrBlank() || recipient.isNullOrBlank()) null else UpiTag(
                        doc.id,
                        name,
                        doc.getString("iconName") ?: "Category",
                        doc.getString("colorHex") ?: "#00897B",
                        recipient,
                        doc.getLong("categoryId"),
                        doc.getString("categoryName")?.trim()
                    )
                }.distinctBy { it.tagName.trim().lowercase(Locale.getDefault()) }
            } catch (e: Exception) {
                error = e.message ?: "Unable to load saved tags"
            }
        }
        loadingTags = false
    }

    fun applyTag(tag: UpiTag) {
        selectedTag = tag
        selectedIcon = tag.iconName
        selectedColor = tag.colorHex
        selectedCategory = categories.firstOrNull { tag.categoryId != null && it.id == tag.categoryId }
            ?: categories.firstOrNull { it.name.equals(tag.categoryName, true) }
        error = null
    }

    AlertDialog(
        onDismissRequest = { if (!saving) onDismiss() },
        title = { Text(sms.recipient, fontWeight = FontWeight.Bold) },
        text = {
            Column(Modifier.fillMaxWidth(), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                OutlinedButton(
                    onClick = { if (savedTags.isNotEmpty()) tagMenuExpanded = true },
                    enabled = !loadingTags && savedTags.isNotEmpty(),
                    modifier = Modifier.fillMaxWidth(),
                    shape = RoundedCornerShape(12.dp)
                ) {
                    Text(
                        when {
                            loadingTags -> "Loading saved tags..."
                            selectedTag != null -> selectedTag!!.tagName
                            savedTags.isEmpty() -> "No saved tags yet"
                            else -> "Select Saved Tag"
                        },
                        Modifier.weight(1f)
                    )
                    Icon(Icons.Default.ArrowDropDown, null)
                }
                DropdownMenu(
                    expanded = tagMenuExpanded,
                    onDismissRequest = { tagMenuExpanded = false }
                ) {
                    savedTags.forEach { tag ->
                        DropdownMenuItem(
                            text = {
                                Row(verticalAlignment = Alignment.CenterVertically) {
                                    val tagColor = CategoryIconHelper.parseColor(tag.colorHex)
                                    Box(
                                        Modifier.size(32.dp).clip(CircleShape)
                                            .background(tagColor.copy(alpha = 0.14f)),
                                        contentAlignment = Alignment.Center
                                    ) {
                                        Icon(
                                            CategoryIconHelper.getIcon(tag.iconName),
                                            tag.tagName,
                                            tint = tagColor,
                                            modifier = Modifier.size(18.dp)
                                        )
                                    }
                                    Spacer(Modifier.width(10.dp))
                                    Column {
                                        Text(tag.tagName, fontWeight = FontWeight.SemiBold)
                                        tag.categoryName?.takeIf { it.isNotBlank() }?.let {
                                            Text(it, style = MaterialTheme.typography.labelSmall,
                                                color = MaterialTheme.colorScheme.onSurfaceVariant)
                                        }
                                    }
                                }
                            },
                            onClick = {
                                applyTag(tag)
                                tagMenuExpanded = false
                            }
                        )
                    }
                }

                selectedTag?.let {
                    Text(
                        "Tag: ${it.tagName}",
                        style = MaterialTheme.typography.labelMedium,
                        color = MaterialTheme.colorScheme.primary,
                        fontWeight = FontWeight.Bold
                    )
                }

                Box {
                    OutlinedButton(
                        onClick = { categoryMenuExpanded = true },
                        modifier = Modifier.fillMaxWidth(),
                        shape = RoundedCornerShape(12.dp)
                    ) {
                        Text(selectedCategory?.name ?: "Select Expense Category", Modifier.weight(1f))
                        Icon(Icons.Default.ArrowDropDown, null)
                    }
                    DropdownMenu(
                        expanded = categoryMenuExpanded,
                        onDismissRequest = { categoryMenuExpanded = false }
                    ) {
                        categories.forEach { category ->
                            DropdownMenuItem(
                                text = { Text(category.name) },
                                onClick = {
                                    selectedCategory = category
                                    categoryMenuExpanded = false
                                }
                            )
                        }
                    }
                }

                error?.let { Text(it, color = ExpenseRed, style = MaterialTheme.typography.bodySmall) }

                Text("Choose Icon", style = MaterialTheme.typography.labelLarge, fontWeight = FontWeight.Bold)
                FlowRow(
                    Modifier.fillMaxWidth(),
                    horizontalArrangement = Arrangement.spacedBy(8.dp),
                    verticalArrangement = Arrangement.spacedBy(8.dp)
                ) {
                    CategoryIconHelper.AVAILABLE_ICONS.take(16).forEach { (key, vector) ->
                        val selected = selectedIcon == key
                        Box(
                            Modifier.size(38.dp).clip(RoundedCornerShape(8.dp))
                                .background(if (selected) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.surfaceVariant)
                                .clickable { selectedIcon = key },
                            contentAlignment = Alignment.Center
                        ) {
                            Icon(vector, key,
                                tint = if (selected) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant,
                                modifier = Modifier.size(22.dp))
                        }
                    }
                }

                Text("Choose Color", style = MaterialTheme.typography.labelLarge, fontWeight = FontWeight.Bold)
                FlowRow(
                    Modifier.fillMaxWidth(),
                    horizontalArrangement = Arrangement.spacedBy(8.dp),
                    verticalArrangement = Arrangement.spacedBy(8.dp)
                ) {
                    CategoryIconHelper.PRESET_COLORS.take(12).forEach { colorHex ->
                        val selected = selectedColor.equals(colorHex, true)
                        Box(
                            Modifier.size(34.dp).clip(CircleShape)
                                .background(CategoryIconHelper.parseColor(colorHex))
                                .clickable { selectedColor = colorHex },
                            contentAlignment = Alignment.Center
                        ) {
                            if (selected) Icon(Icons.Default.Check, null, tint = Color.White, modifier = Modifier.size(18.dp))
                        }
                    }
                }
            }
        },
        confirmButton = {
            Button(enabled = !saving && selectedTag != null, onClick = {
                if (selectedTag == null) {
                    error = "Please select a saved tag"
                    return@Button
                }
                if (selectedCategory == null) {
                    error = "Please select an expense category"
                    return@Button
                }
                val uid = FirebaseAuth.getInstance().currentUser?.uid ?: run {
                    error = "User is not logged in"
                    return@Button
                }
                saving = true
                scope.launch {
                    try {
                        FirebaseFirestore.getInstance().collection("users").document(uid)
                            .collection("upi_tags").document(sms.id)
                            .set(
                                mapOf(
                                    "tagName" to selectedTag!!.tagName,
                                    "iconName" to selectedIcon,
                                    "colorHex" to selectedColor,
                                    "recipient" to sms.recipient,
                                    "sender" to sms.sender,
                                    "amount" to sms.amount,
                                    "body" to sms.body,
                                    "date" to sms.date,
                                    "categoryId" to selectedCategory!!.id,
                                    "categoryName" to selectedCategory!!.name,
                                    "updatedAt" to com.google.firebase.Timestamp.now()
                                )
                            ).await()
                        onSaved("UPI tag saved")
                    } catch (e: Exception) {
                        error = e.message ?: "Unable to save UPI tag"
                        saving = false
                    }
                }
            }) { Text(if (saving) "Saving..." else "Save") }
        },
        dismissButton = { TextButton(enabled = !saving, onClick = onDismiss) { Text("Cancel") } }
    )
}
'''
          path.write_text(text[:start] + replacement)
          print("Updated", path)
          PY

      - name: Verify changed source
        run: |
          grep -n "Select Saved Tag\|No saved tags yet\|private fun TagUpiDialog" app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt
          git commit -m "Add saved UPI tag picker" || exit 0
          git push
