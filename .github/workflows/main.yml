name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply UPI UI directly to source code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt")
          s = p.read_text()
          replacements = [
            ('Column(Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp)) {', 'Column(Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 10.dp)) {'),
            ('Spacer(Modifier.height(10.dp))\n                Surface(shape = RoundedCornerShape(16.dp)', 'Spacer(Modifier.height(8.dp))\n                Surface(shape = RoundedCornerShape(16.dp)'),
            ('Text(title, modifier = Modifier.padding(vertical = 11.dp)', 'Text(title, modifier = Modifier.padding(vertical = 12.dp)'),
            ('Row(Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 12.dp)', 'Row(Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp)'),
            ('LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(12.dp), contentPadding = PaddingValues(bottom = 24.dp))', 'LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(10.dp), contentPadding = PaddingValues(bottom = 24.dp))'),
            ('Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(20.dp), elevation = CardDefaults.cardElevation(defaultElevation = 2.dp)) {\n                        Column(Modifier.padding(16.dp)) {', 'Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(18.dp), elevation = CardDefaults.cardElevation(defaultElevation = 2.dp)) {\n                        Column(Modifier.padding(14.dp)) {'),
            ('Spacer(Modifier.height(12.dp))\n                            Surface(Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp)', 'Spacer(Modifier.height(9.dp))\n                            Surface(Modifier.fillMaxWidth(), shape = RoundedCornerShape(13.dp)'),
            ('Text(sms.body, Modifier.padding(12.dp), style = MaterialTheme.typography.bodyMedium, maxLines = 4)', 'Text(sms.body, Modifier.padding(horizontal = 12.dp, vertical = 10.dp), style = MaterialTheme.typography.bodyMedium, maxLines = 3)'),
            ('Spacer(Modifier.height(10.dp)); val tagColor', 'Spacer(Modifier.height(8.dp)); val tagColor'),
            ('Spacer(Modifier.height(12.dp))\n                            if (alreadyAdded)', 'Spacer(Modifier.height(9.dp))\n                            if (alreadyAdded)'),
            ('shape = RoundedCornerShape(13.dp)) { Icon(Icons.Default.Add', 'shape = RoundedCornerShape(12.dp)) { Icon(Icons.Default.Add'),
            ('shape = RoundedCornerShape(13.dp)) { Icon(Icons.Default.LocalOffer', 'shape = RoundedCornerShape(12.dp)) { Icon(Icons.Default.LocalOffer'),
          ]
          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          p.write_text(s)
          print("UI changes applied:" , changed)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt
            git commit -m "Refine UPI Transactions UI only [skip ci]"
            git push
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 GitHub Secret is missing. Add the base64-encoded release keystore before running this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Set release version
        run: echo "APP_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.APP_VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: Expense Tracker v${{ env.APP_VERSION_NAME }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
