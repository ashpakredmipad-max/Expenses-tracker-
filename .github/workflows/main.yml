name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Migrate UPI SMS ID to a private transaction field
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return False
              if old not in text:
                  raise SystemExit(f"Expected source pattern not found in {path}: {label}")
              p.write_text(text.replace(old, new, 1))
              return True

          changed = False

          changed |= replace(
              "app/src/main/java/com/example/data/local/database/entity/TransactionEntity.kt",
              '    val note: String = "",\n    val createdAt: Long = System.currentTimeMillis()\n',
              '    val note: String = "",\n    val upiSmsId: String? = null,\n    val createdAt: Long = System.currentTimeMillis()\n',
              "TransactionEntity upiSmsId"
          )

          changed |= replace(
              "app/src/main/java/com/example/data/local/database/AppDatabase.kt",
              '@Database(entities = [CategoryEntity::class, TransactionEntity::class, BudgetEntity::class, AppSettingEntity::class, RegisteredUpiEntity::class], version = 2, exportSchema = false)',
              '@Database(entities = [CategoryEntity::class, TransactionEntity::class, BudgetEntity::class, AppSettingEntity::class, RegisteredUpiEntity::class], version = 3, exportSchema = false)',
              "database version"
          )
          changed |= replace(
              "app/src/main/java/com/example/data/local/database/AppDatabase.kt",
              '        private val MIGRATION_1_2 = object : Migration(1, 2) {',
              '        private val MIGRATION_1_2 = object : Migration(1, 2) {',
              "migration anchor"
          ) if False else False
          changed |= replace(
              "app/src/main/java/com/example/data/local/database/AppDatabase.kt",
              '        fun getInstance(context: Context): AppDatabase = INSTANCE ?: synchronized(this) {\n            Room.databaseBuilder(context.applicationContext, AppDatabase::class.java, "expense_tracker.db")\n                .addMigrations(MIGRATION_1_2)',
              '        private val MIGRATION_2_3 = object : Migration(2, 3) {\n            override fun migrate(db: SupportSQLiteDatabase) {\n                db.execSQL("ALTER TABLE transactions ADD COLUMN upiSmsId TEXT")\n            }\n        }\n\n        fun getInstance(context: Context): AppDatabase = INSTANCE ?: synchronized(this) {\n            Room.databaseBuilder(context.applicationContext, AppDatabase::class.java, "expense_tracker.db")\n                .addMigrations(MIGRATION_1_2, MIGRATION_2_3)',
              "database migration"
          )

          changed |= replace(
              "app/src/main/java/com/example/viewmodel/ExpenseViewModel.kt",
              '        date: Long,\n        note: String = "",\n        onComplete: () -> Unit\n',
              '        date: Long,\n        note: String = "",\n        upiSmsId: String? = null,\n        onComplete: () -> Unit\n',
              "saveTransaction upiSmsId parameter"
          )
          changed |= replace(
              "app/src/main/java/com/example/viewmodel/ExpenseViewModel.kt",
              '                date = date,\n                note = note.trim(),\n                createdAt = if (id == 0L) System.currentTimeMillis() else date\n',
              '                date = date,\n                note = note.trim(),\n                upiSmsId = upiSmsId?.trim()?.takeIf { it.isNotEmpty() },\n                createdAt = if (id == 0L) System.currentTimeMillis() else date\n',
              "saveTransaction entity field"
          )

          changed |= replace(
              "app/src/main/java/com/example/data/repository/ExpenseRepository.kt",
              '        "date" to tx.date, "note" to tx.note, "createdAt" to tx.createdAt\n',
              '        "date" to tx.date, "note" to tx.note, "upiSmsId" to (tx.upiSmsId ?: ""), "createdAt" to tx.createdAt\n',
              "cloud transaction map"
          )
          changed |= replace(
              "app/src/main/java/com/example/data/repository/ExpenseRepository.kt",
              'categoryColorHex = doc.getString("categoryColorHex") ?: "", date = doc.getLong("date") ?: 0L, note = doc.getString("note") ?: "", createdAt = doc.getLong("createdAt") ?: System.currentTimeMillis())',
              'categoryColorHex = doc.getString("categoryColorHex") ?: "", date = doc.getLong("date") ?: 0L, note = doc.getString("note") ?: "", upiSmsId = doc.getString("upiSmsId")?.takeIf { it.isNotBlank() }, createdAt = doc.getLong("createdAt") ?: System.currentTimeMillis())',
              "cloud transaction restore"
          )

          changed |= replace(
              "app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt",
              'viewModel.saveTransaction("EXPENSE", paise, category, sms.date, "[UPI_SMS_ID:${sms.id}] ${sms.recipient} • ${tag.tagName}") {',
              'viewModel.saveTransaction(\n                    id = 0L,\n                    type = "EXPENSE",\n                    amountInPaise = paise,\n                    category = category,\n                    date = sms.date,\n                    note = "${sms.recipient} • ${tag.tagName}",\n                    upiSmsId = sms.id\n                ) {',
              "UPI save call"
          )
          changed |= replace(
              "app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt",
              '    val marker = "[UPI_SMS_ID:${sms.id}]"\n    if (transactions.any { it.type.equals("EXPENSE", true) && it.note.contains(marker) }) return true\n',
              '    if (transactions.any { it.type.equals("EXPENSE", true) && it.upiSmsId == sms.id }) return true\n',
              "UPI duplicate marker"
          )

          if changed:
              print("UPI SMS ID migration applied")
          else:
              print("UPI SMS ID migration already applied")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add app/src/main/java/com/example/data/local/database/entity/TransactionEntity.kt \
              app/src/main/java/com/example/data/local/database/AppDatabase.kt \
              app/src/main/java/com/example/viewmodel/ExpenseViewModel.kt \
              app/src/main/java/com/example/data/repository/ExpenseRepository.kt \
              app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt
            git commit -m "Store UPI SMS ID separately from transaction note [skip ci]"
            git push
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 GitHub Secret is missing. Add the base64-encoded release keystore before running this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Set release version
        run: echo "APP_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.APP_VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: Expense Tracker v${{ env.APP_VERSION_NAME }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
