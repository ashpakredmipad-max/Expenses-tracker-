name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply UPI UI directly to source code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt")
          s = p.read_text()

          # Remove only the inner UPI title/subtitle/filter toolbar.
          # Keep the Messages/Tags tabs and all functional logic unchanged.
          pattern = r'\n        Surface\(color = pageBg, tonalElevation = 0\.dp\) \{.*?\n        \}\n\n        if \(selectedTab == 1\)'
          s2, count = re.subn(pattern, '\n\n        if (selectedTab == 1)', s, count=1, flags=re.DOTALL)
          if count == 0:
              raise SystemExit("UPI toolbar block not found; refusing to modify source.")
          p.write_text(s2)
          print("Removed inner UPI title/subtitle/filter toolbar. UI logic unchanged.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt
            git commit -m "Remove duplicate UPI toolbar from screen UI [skip ci]"
            git push
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 GitHub Secret is missing. Add the base64-encoded release keystore before running this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Set release version
        run: echo "APP_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.APP_VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: Expense Tracker v${{ env.APP_VERSION_NAME }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
