name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply UPI credit/debit UI directly to source code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt")
          s = p.read_text()

          # Keep the direction derived from the SMS body. No save/duplicate logic is changed.
          old = 'private data class UpiSms(val id: String, val sender: String, val body: String, val date: Long, val amount: String?, val recipient: String)'
          new = 'private data class UpiSms(val id: String, val sender: String, val body: String, val date: Long, val amount: String?, val recipient: String, val isCredit: Boolean)'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'private data class UpiSms(' not in s:
              raise SystemExit("UpiSms data class not found; refusing to modify source.")

          old = 'result += UpiSms(cursor.getString(idIndex), cursor.getString(addressIndex) ?: "Unknown", body, cursor.getLong(dateIndex), amount, extractRecipient(body))'
          new = 'result += UpiSms(cursor.getString(idIndex), cursor.getString(addressIndex) ?: "Unknown", body, cursor.getLong(dateIndex), amount, extractRecipient(body), isCredit = isCreditSms(body))'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'isCredit = isCreditSms(body)' not in s:
              raise SystemExit("UPI SMS creation line not found; refusing to modify source.")

          marker = 'private fun extractRecipient(body: String): String {'
          helper = '''private fun isCreditSms(body: String): Boolean {
              return Regex("(?i)\\b(?:credited|credit|received|received from|deposited)\\b").containsMatchIn(body) &&
                  !Regex("(?i)\\b(?:debited|debit|sent|paid)\\b").containsMatchIn(body)
          }

          '''
          if 'private fun isCreditSms(body: String)' not in s:
              if marker not in s:
                  raise SystemExit("Recipient parser marker not found; refusing to modify source.")
              s = s.replace(marker, helper + marker, 1)

          # Credit messages: green amount + green down arrow/label + light green card.
          # Sent/debit messages: red amount + red up arrow/label + light red card.
          old = 'Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(18.dp), colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), elevation = CardDefaults.cardElevation(defaultElevation = 2.dp))'
          new = 'Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(18.dp), colors = CardDefaults.cardColors(containerColor = if (sms.isCredit) Color(0xFFE8F5E9) else Color(0xFFFFEBEE)), elevation = CardDefaults.cardElevation(defaultElevation = 2.dp))'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'containerColor = if (sms.isCredit)' not in s:
              raise SystemExit("UPI transaction card UI line not found; refusing to modify source.")

          old = 'Box(Modifier.size(46.dp).clip(CircleShape).background(softGreen), contentAlignment = Alignment.Center) { Icon(Icons.Default.Sms, null, tint = green, modifier = Modifier.size(23.dp)) }'
          new = 'Box(Modifier.size(46.dp).clip(CircleShape).background(if (sms.isCredit) Color(0xFFC8E6C9) else Color(0xFFFFCDD2)), contentAlignment = Alignment.Center) { Icon(Icons.Default.Sms, null, tint = if (sms.isCredit) Color(0xFF2E7D32) else ExpenseRed, modifier = Modifier.size(23.dp)) }'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'background(if (sms.isCredit)' not in s:
              raise SystemExit("UPI message icon UI line not found; refusing to modify source.")

          old = 'sms.amount?.let { Text(it, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, color = green) }'
          new = 'sms.amount?.let { Text(it, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, color = if (sms.isCredit) Color(0xFF2E7D32) else ExpenseRed) }'
          if old in s:
              s = s.replace(old, new, 1)

          old = 'Row(verticalAlignment = Alignment.CenterVertically) { Icon(Icons.Default.ArrowCircleUp, null, tint = green, modifier = Modifier.size(16.dp)); Spacer(Modifier.width(7.dp)); Text("Sent ${sms.amount ?: "—"}", style = MaterialTheme.typography.bodySmall, fontWeight = FontWeight.Medium) }'
          new = 'Row(verticalAlignment = Alignment.CenterVertically) { Icon(if (sms.isCredit) Icons.Default.ArrowCircleDown else Icons.Default.ArrowCircleUp, null, tint = if (sms.isCredit) Color(0xFF2E7D32) else ExpenseRed, modifier = Modifier.size(16.dp)); Spacer(Modifier.width(7.dp)); Text(if (sms.isCredit) "Credited ${sms.amount ?: "—"}" else "Sent ${sms.amount ?: "—"}", style = MaterialTheme.typography.bodySmall, fontWeight = FontWeight.Medium, color = if (sms.isCredit) Color(0xFF2E7D32) else ExpenseRed) }'
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt; then
            git add app/src/main/java/com/example/ui/upi/UPITransactionsScreen.kt
            git commit -m "Color UPI credit messages green and sent messages red [skip ci]"
            git push
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 GitHub Secret is missing. Add the base64-encoded release keystore before running this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Set release version
        run: echo "APP_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.APP_VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: Expense Tracker v${{ env.APP_VERSION_NAME }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
