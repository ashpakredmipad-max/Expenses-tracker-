name: Verify saved UPI tag picker

on:
  push:
    paths:
      - '.github/workflows/verify-upi-tag-picker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Remove temporary verification workflow
        run: |
          rm -f .github/workflows/verify-upi-tag-picker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary UPI tag verification workflow"
          git push
